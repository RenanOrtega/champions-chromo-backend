# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check Fly token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Secret FLY_API_TOKEN is not set. Create one with 'fly tokens create deploy -a champions-chromo-backend' and add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! flyctl status > /dev/null; then
            echo "::error::FLY_API_TOKEN was rejected by Fly (expired, revoked or for another app). Create a new one with 'fly tokens create deploy -a champions-chromo-backend' and update the secret."
            exit 1
          fi
      - run: flyctl deploy --remote-only
