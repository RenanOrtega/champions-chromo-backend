name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore ChampionsChromo.sln
      - run: dotnet build ChampionsChromo.sln --no-restore -c Release
      - name: Check for vulnerable packages
        run: dotnet list ChampionsChromo.sln package --vulnerable --include-transitive
